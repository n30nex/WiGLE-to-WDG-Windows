name: Test and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Build clean Windows ZIP
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'wigle-to-wdg-windows'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Path $stage, $dist | Out-Null
          $files = @(
            '.env.example',
            'LICENSE',
            'README.md',
            'run_dry_test.bat',
            'run_wigle_to_wdg.bat',
            'run_wigle_to_wdg_now.bat',
            'setup_config.bat',
            'wigle_to_wdg.py'
          )
          foreach ($file in $files) {
            Copy-Item -LiteralPath $file -Destination $stage
          }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath (Join-Path $dist 'wigle-to-wdg-windows.zip')

      - name: Verify ZIP allowlist
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = Join-Path $env:GITHUB_WORKSPACE 'dist\wigle-to-wdg-windows.zip'
          $zip = [IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $actual = @($zip.Entries.FullName | Sort-Object)
            $expected = @(
              '.env.example',
              'LICENSE',
              'README.md',
              'run_dry_test.bat',
              'run_wigle_to_wdg.bat',
              'run_wigle_to_wdg_now.bat',
              'setup_config.bat',
              'wigle_to_wdg.py'
            ) | Sort-Object
            if (Compare-Object $expected $actual) {
              throw "ZIP contents differ from the public allowlist: $($actual -join ', ')"
            }
          } finally {
            $zip.Dispose()
          }

      - uses: actions/upload-artifact@v4
        with:
          name: wigle-to-wdg-windows-${{ github.sha }}
          path: dist/wigle-to-wdg-windows.zip
          if-no-files-found: error
